name: CI

on:
  push:
  pull_request:

jobs:
  run-tests:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment-ci.yml
          activate-environment: pytest
          auto-activate-base: false

      - name: Run Pytest
        shell: bash -el {0}
        env:
          PYTHONPATH: .
        run: pytest ./dev/script/app/py_test

      - name: Run Ruff
        shell: bash -el {0}
        env:
          PYTHONPATH: .
        run: ruff format --check ./dev/script/app

      - name: Run Mypy
        shell: bash -el {0}
        env:
          PYTHONPATH: .
        run: mypy ./dev/script/app --ignore-missing-imports --follow-imports skip

      - name: Run Flake
        shell: bash -el {0}
        env:
          PYTHONPATH: .
        run: flake8 --max-complexity 12 ./dev/script/app