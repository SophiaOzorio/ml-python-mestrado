name: CI

on:
  push:
  pull_request:

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
    
    name: Test
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest ./dev/script/app/py_test

      - name: Run Ruff
        env:
          PYTHONPATH: .
        run: ruff format --check ./dev/script/app
      
      - name: Run Mypy
        env:
          PYTHONPATH: .
        run: mypy ./dev/script/app --ignore-missing-imports --follow-imports skip
      
      - name: Run Flake
        env:
          PYTHONPATH: .
        run: flake8 --max-complexity 12 ./dev/script/app